# Daftar entitas untuk deteksi afiliasi berbasis aturan.
# - handles: username media sosial (tanpa @, huruf kecil). Verifikasi ulang sebelum dipakai
#   untuk keputusan penting; handle bisa berbeda antar platform dan bisa berubah.
# - domains: domain resmi (paling andal untuk pencocokan).
